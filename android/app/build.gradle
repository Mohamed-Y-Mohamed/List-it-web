apply plugin: 'com.android.application'

// Upload-key credentials, deliberately kept out of version control. Copy
// android/keystore.properties.example to android/keystore.properties and point it
// at your .jks. When that file is absent the release build is simply unsigned, so
// a fresh checkout and CI still build — only `bundleRelease` needs it.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasSigningConfig = keystorePropertiesFile.exists()
if (hasSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// The only number to change for a release. Bump it by exactly one per Play
// upload and the version name follows from it: 3 is 0.3.0, 10 is 1.0.0, 19 is
// 1.9.0, 20 is 2.0.0.
//
// Derived rather than hand-written because the two have already drifted apart
// once. Play refuses any upload whose code is not higher than the last one it
// accepted, so this only ever goes up. Nothing has been uploaded under
// com.list_it.app yet, which is why starting again at 3 is safe.
def appVersionCode = 6
def appVersionName = "${appVersionCode.intdiv(10)}.${appVersionCode % 10}.0"

android {
    namespace = "com.list_it.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.list_it.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }

            // R8 shrinks and obfuscates the release build. The mapping file it
            // produces is packaged into the AAB automatically, which is what
            // clears Play's "no deobfuscation file associated with this App
            // Bundle" warning and makes crash reports readable.
            //
            // Capacitor resolves plugins reflectively, so this only works with
            // the keeps in proguard-rules.pro. Smoke-test a release build on a
            // device after changing either — plugin breakage from over-shrinking
            // never shows up in a debug build.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
